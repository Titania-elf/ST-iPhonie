<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ST-TTS · 角色对白</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="shell">
<header class="app-header"><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 15v10M14 8v24M21 3v34M28 11v18M35 17v6"/></svg><div><h1>ST-TTS</h1><span>角色对白</span></div></div><button class="ghost chat-link" id="show-chat">听见这一刻 <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg></button><button class="icon-button" id="close-settings" aria-label="关闭设置">×</button></header>
<div class="layout"><main class="workspace">
<nav class="tabs" aria-label="插件页面"><button data-tab="roles" aria-current="page">角色配音</button><button data-tab="presets">提示词预设</button><button data-tab="engines">引擎连接</button><button data-tab="settings">通用设置</button></nav>
<div id="page"></div>
</main></div>
<footer class="footer"><span>ST-TTS <span class="footer-line"></span> 0.1.4</span><span>Fish Audio <span> / </span> MiniMax <span> / </span> ElevenLabs</span></footer>
</div>
<dialog id="chat-drawer" aria-labelledby="chat-title"><section class="chat-panel" id="chat-panel"><div class="chat-heading"><div class="drawer-top"><span class="eyebrow">READ & LISTEN</span><button class="icon-button" id="close-chat" aria-label="关闭听见这一刻">×</button></div><div><h2 id="chat-title">听见这一刻</h2><button class="info" data-help="chat" aria-label="听见这一刻说明">i</button></div></div><div class="story"><div id="dialogue"></div></div><div class="player"><div class="player-caption"><span id="player-status" role="status">等待播放</span><span id="player-count">00 / 04</span></div><div class="progress"><span id="progress-fill"></span></div><div class="player-actions"><button class="primary" id="play-all"><span class="play-icon"></span>整条播放</button><button class="icon-button" id="stop" aria-label="停止播放" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1"/></svg></button></div></div></section></dialog>
<dialog id="help-dialog"><div class="dialog-heading"><h2 id="help-title"></h2><button class="icon-button close-dialog" aria-label="关闭说明">×</button></div><p id="help-text"></p><a id="help-source" href="#" target="_blank" rel="noopener noreferrer" hidden>查看官网文档</a><button class="primary close-dialog">知道了</button></dialog>
<dialog id="name-dialog"><form id="name-form"><div class="dialog-heading"><h2 id="name-title">新增角色</h2><button type="button" class="icon-button close-dialog" aria-label="关闭">×</button></div><label class="field" for="new-name"><span>名称</span><input id="new-name" maxlength="40" required autocomplete="off"></label><p id="name-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="ghost close-dialog">取消</button><button class="primary" type="submit">确定</button></div></form></dialog>
<dialog id="delete-role-dialog" aria-labelledby="delete-role-title"><div class="dialog-heading"><h2 id="delete-role-title">删除角色配音</h2><button type="button" class="icon-button close-dialog" aria-label="取消删除">×</button></div><p>删除「<span id="delete-role-name"></span>」的配音绑定？</p><div class="dialog-actions"><button type="button" class="ghost close-dialog">取消</button><button type="button" class="primary" id="confirm-delete-role">删除</button></div></dialog>
<div id="toast" role="status"></div>
<script src="bridge.js"></script><script src="parameters.js"></script><script src="parameter-ui.js"></script><script src="app.js"></script></body></html>
